<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ทริปเหนือ 69</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7F4; --surface:#FFFFFF; --ink:#16221D; --muted:#5A6A63; --line:#DDE5E0;
  --accent:#1E6B57; --accent-ink:#FFFFFF; --accent-soft:#E3F0EB;
  --tt:#16221D; --tt-ink:#FFFFFF; --shadow:0 1px 2px rgba(22,34,29,.06),0 8px 24px rgba(22,34,29,.06);
  --d1:#8B6FC7; --d2:#D9645A; --d3:#D9A72F; --d4:#D6699A; --d5:#4E9A6B; --d6:#DE8A3A; --d7:#4C86C8; --d8:#8B6FC7;
  --f-display:"Prompt","IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1613; --surface:#16201C; --ink:#E8F0EC; --muted:#93A59C; --line:#26332D;
    --accent:#4FB593; --accent-ink:#08140F; --accent-soft:#17302A;
    --tt:#E8F0EC; --tt-ink:#0F1613; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#16201C; --ink:#E8F0EC; --muted:#93A59C; --line:#26332D;
  --accent:#4FB593; --accent-ink:#08140F; --accent-soft:#17302A;
  --tt:#E8F0EC; --tt-ink:#0F1613; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:880px;margin-inline:auto}

/* header */
.hero{padding-block:44px 28px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,8vw,64px);line-height:1.1;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
.sub{font-size:18px;color:var(--muted);margin:0}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:28px 0 0;padding:0;list-style:none;font-size:14px}
.route li{display:flex;align-items:center;gap:8px;color:var(--ink)}
.route li:not(:last-child)::after{content:"";width:14px;height:1px;background:var(--muted);opacity:.6}
.route .stop{padding:3px 11px;border:1px solid var(--line);border-radius:99px;background:var(--surface)}

/* day nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.nav-in{max-width:880px;margin-inline:auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.nav a{flex:none;display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;font-size:14px;color:var(--muted);text-decoration:none;border:1px solid transparent;white-space:nowrap}
.nav a i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="true"]{color:var(--ink);background:var(--surface);border-color:var(--line)}
a:focus-visible,button:focus-visible,input:focus-visible+.box{outline:2px solid var(--accent);outline-offset:2px}

/* day */
.day{display:grid;grid-template-columns:150px 1fr;gap:0 32px;padding-block:44px 8px;border-bottom:1px solid var(--line)}
.day:last-of-type{border-bottom:0}
.day-head{align-self:start;position:sticky;top:72px}
.day-num{font-family:var(--f-display);font-weight:700;font-size:64px;line-height:1;color:var(--c);letter-spacing:-.02em}
.day-meta{margin-top:8px;font-size:14px;color:var(--muted)}
.day-meta b{display:block;font-family:var(--f-display);font-weight:600;font-size:17px;color:var(--ink)}
.day-tag{margin-top:10px;font-size:14px;color:var(--ink)}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:11px;top:14px;bottom:36px;width:1px;background:var(--line)}
.item{position:relative;display:grid;grid-template-columns:24px 1fr;gap:16px;padding-bottom:32px}
.chk{position:relative;display:block;width:24px;height:24px;margin-top:2px;cursor:pointer}
.chk input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.box{position:absolute;inset:0;border-radius:50%;background:var(--bg);border:2px solid var(--c);display:grid;place-items:center;transition:background .15s}
.box svg{width:12px;height:12px;stroke:var(--accent-ink);opacity:0;transition:opacity .15s}
.chk input:checked+.box{background:var(--c)}
.chk input:checked+.box svg{opacity:1;stroke:#fff}
.time{font-family:var(--f-mono);font-weight:500;font-size:14px;color:var(--muted);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.title{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.4;margin:2px 0 0;text-wrap:balance}
.note{margin:2px 0 0;color:var(--muted);font-size:15px}
.item.done .title{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px 8px 12px;border-radius:99px;font:500 14px/1.2 var(--f-body);text-decoration:none;cursor:pointer;border:1px solid transparent;transition:transform .12s,box-shadow .12s,background .12s}
.btn svg{width:17px;height:17px;flex:none}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-map{background:var(--accent);color:var(--accent-ink)}
.btn-hotel{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-hotel svg{color:var(--accent)}
.btn-tt{background:var(--tt);color:var(--tt-ink)}
.btn-tt .who{font-weight:400;opacity:.65;font-size:13px;padding-left:8px;border-left:1px solid currentColor;border-color:color-mix(in srgb,currentColor 30%,transparent)}

/* preview dialog */
dialog{width:min(100% - 32px,400px);max-height:calc(100% - 32px);padding:0;border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);box-shadow:0 24px 64px rgba(0,0,0,.35);overflow:hidden}
dialog::backdrop{background:rgba(10,16,13,.6);backdrop-filter:blur(3px)}
.dlg-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 16px 12px 20px}
.dlg-top h2{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.4;margin:0}
.dlg-top p{margin:0;font-size:13px;color:var(--muted)}
.x{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.x svg{width:14px;height:14px}
.frame{margin-inline:16px;border-radius:14px;overflow:hidden;background:var(--bg);border:1px solid var(--line);height:min(62vh,600px);position:relative}
.frame::before{content:"กำลังโหลดคลิป…";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
.frame iframe{position:relative;width:100%;height:100%;border:0;display:block}
.dlg-foot{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.dlg-foot small{color:var(--muted);font-size:13px}

.foot{padding-top:40px;color:var(--muted);font-size:14px}

@media (max-width:680px){
  .day{grid-template-columns:1fr;padding-block:36px 4px}
  .day-head{position:static;display:flex;align-items:baseline;gap:14px;margin-bottom:22px;flex-wrap:wrap}
  .day-num{font-size:52px}
  .day-meta{margin:0}
  .day-tag{margin:0;flex-basis:100%}
  .item{gap:14px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn,.box{transition:none}.btn:hover{transform:none}}
</style>

</head>
<body>
<div class="wrap">
  <header class="hero">
    <p class="eyebrow">Northern Thailand · 2569</p>
    <h1>ทริปเหนือ</h1>
    <p class="sub">17 – 24 ตุลาคม 2569 · ทริปมอเตอร์ไซค์ 8 วัน</p>
    <ol class="route" id="route" aria-label="เส้นทาง"></ol>
  </header>
</div>

<nav class="nav" aria-label="เลือกวัน"><div class="nav-in" id="nav"></div></nav>

<main class="wrap" id="days"></main>

<div class="wrap"><p class="foot">ติ๊กวงกลมหน้ารายการเพื่อเช็กว่าทำแล้ว · กด Preview เพื่อดูคลิปสถานที่จาก TikTok</p></div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-top">
    <div><h2 id="dlg-title"></h2><p id="dlg-who"></p></div>
    <button class="x" id="dlg-x" aria-label="ปิด"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l10 10M12 2L2 12"/></svg></button>
  </div>
  <div class="frame" id="frame"></div>
  <div class="dlg-foot">
    <a class="btn btn-tt" id="dlg-open" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>เปิดใน TikTok</a>
    <small>ถ้าคลิปไม่แสดงในหน้านี้ กด “เปิดใน TikTok” เพื่อดูโดยตรง</small>
  </div>
</dialog>

<script>
const M = id => 'https://maps.app.goo.gl/' + id;
const H = id => 'https://www.trip.com/w/' + id;
const T = (user, id) => ({user, id});

const DAYS = [
  { n:17, wd:'เสาร์', tag:'ออกเดินทางจากกรุงเทพฯ', items:[
    { t:'17.30', title:'ออกจากกรุงเทพฯ', note:'ปั๊มคาลเท็กซ์-เพียวไทย สาขาศาลากลาง', map:M('RhK6Z8PCQjTsTreXA') },
  ]},
  { n:18, wd:'อาทิตย์', tag:'ตาก → เชียงใหม่', items:[
    { t:'01.30', title:'ถึงที่พัก จ.ตาก', note:'เข้าที่พัก โรงแรมบีริช ตาก', hotel:H('L6fw2jcWRW2') },
    { t:'08.00', title:'ออกจากโรงแรมบีริช ตาก', note:'เดินทางสู่ จ.เชียงใหม่', map:M('uuq9rbZZXZdtUS9s8') },
    { t:'13.00', title:'ถึงที่พัก จ.เชียงใหม่', note:'เข้าที่พัก โรงแรมบีทูแกรนด์ นิมมาน พรีเมียร์', hotel:H('E0ujBM8YRW2') },
    { t:'19.00', title:'เช็คอิน ประตูท่าแพ', note:'เดินเล่น ทานข้าว', map:M('2QVPwP6ykeUULsoi7') },
    { t:'21.00', title:'ท่องราตรีสถานบันเทิง', note:'Warmupcafe Chiangmai', map:M('2QVPwP6ykeUULsoi7') },
    { t:'00.00–01.00', title:'กลับที่พัก', note:'เข้าที่พัก โรงแรมบีทูแกรนด์ นิมมาน พรีเมียร์', hotel:H('E0ujBM8YRW2') },
  ]},
  { n:19, wd:'จันทร์', tag:'เชียงใหม่ → ดอยสกาด น่าน', items:[
    { t:'08.00', title:'ออกจากโรงแรมบีทูแกรนด์', note:'เดินทางสู่ จ.น่าน', hotel:H('E0ujBM8YRW2') },
    { t:'17.00', title:'ดอยสกาด อ.ปัว จ.น่าน', note:'เข้าที่พัก ม่อนสกาด ฟาร์มสเตย์', map:M('hWgXaEL3sEQGUzdc9') },
    { t:'19.00', title:'ปาร์ตี้หมูกะทะบนดอย', note:'พักผ่อนชิลล์ ๆ', tt:T('travel.365days','7672730734741835026') },
  ]},
  { n:20, wd:'อังคาร', tag:'ดอยสกาด → เฮือนฮิมน้ำ สะปัน', items:[
    { t:'10.00', title:'ออกจากที่พัก ม่อนสกาด ฟาร์มสเตย์', note:'เดินทางสู่ คาเฟ่ เอะกาโอะ', map:M('H1VBthTHPNNyy3kr5') },
    { t:'13.00', title:'คาเฟ่ เอะกาโอะ', note:'แวะดื่มกาแฟ', tt:T('john.std','7666447914662776085') },
    { t:'15.00', title:'เดินทางเข้าที่พัก', note:'เข้าที่พัก เฮือนฮิมน้ำ สะปันโฮมสเตย์', map:M('GW6UT8N6r5vgFdvm7') },
    { t:'16.00', title:'เฮือนฮิมน้ำ สะปันโฮมสเตย์', note:'พักผ่อนพูดคุย ดื่มด่ำดาวลอย', tt:T('hueanhimnamsapan','7570963109507026183') },
  ]},
  { n:21, wd:'พุธ', tag:'ทะเลหมอกห้วยโทน', items:[
    { t:'05.30', title:'ชมทะเลหมอก ห้วยโทน', note:'ถ่ายรูปเช็คอิน ตามสบาย', tt:T('taonoysnap','7559146359123873031') },
    { t:'08.00–09.00', title:'เฮือนฮิมน้ำ สะปันโฮมสเตย์', note:'พักผ่อนอีก 1 คืน', tt:T('hueanhimnamsapan','7570963109507026183') },
  ]},
  { n:22, wd:'พฤหัสบดี', tag:'ห้วยหมี · แคมป์ปิ้ง', items:[
    { t:'08.00', title:'เดินทางสู่ห้วยหมี', note:'ทางดีมี 7-11', map:M('fUp51CsegDTzMM7TA') },
    { t:'09.30', title:'ลานกางเต้นท์ ห้วยหมี', note:'กางเต้นท์ ทำกิจกรรมรอบกองไฟ', tt:T('tawatchai_way','7519376470616083730') },
    { t:'01.30', title:'พักผ่อน', note:'' },
  ]},
  { n:23, wd:'ศุกร์', tag:'ลงดอย → แพร่', items:[
    { t:'08.00', title:'เก็บเต้นท์', note:'เดินทางลงดอย' },
    { t:'09.00', title:'แวะขออาบน้ำบ้านชายดัช', note:'เตรียมตัวเดินทางกลับแพร่' },
    { t:'11.00', title:'ออกเดินทางสู่ จ.แพร่', note:'', tt:T('paiteawkunmai','7672717528988241172') },
    { t:'16.30', title:'เข้าพัก บ้านไร่ไอดอย จ.แพร่', note:'', tt:T('pairueai_rueai','7678324085109050632') },
  ]},
  { n:24, wd:'เสาร์', tag:'เดินทางกลับ', items:[
    { t:'09.00', title:'เดินทางกลับกรุงเทพฯ', note:'' },
  ]},
];

const ROUTE = ['กรุงเทพฯ','ตาก','เชียงใหม่','ดอยสกาด','สะปัน','ห้วยหมี','แพร่','กรุงเทพฯ'];

const ICON = {
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  bed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18V6M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="1.5"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10" opacity=".18"/><path d="M10 8.2v7.6a.6.6 0 0 0 .9.5l6-3.8a.6.6 0 0 0 0-1l-6-3.8a.6.6 0 0 0-.9.5z"/></svg>',
  check:'<svg viewBox="0 0 12 12" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.4l2.4 2.3 4.6-5"/></svg>'
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ttUrl = t => `https://www.tiktok.com/@${t.user}/video/${t.id}`;

let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem('north69-done') || '[]')); } catch (e) {}
const save = () => { try { localStorage.setItem('north69-done', JSON.stringify([...done])); } catch (e) {} };

document.getElementById('route').innerHTML = ROUTE.map(r => `<li><span class="stop">${esc(r)}</span></li>`).join('');

document.getElementById('nav').innerHTML = DAYS.map((d, i) =>
  `<a href="#day-${d.n}" data-day="day-${d.n}" style="--c:var(--d${i+1})"><i></i>${d.n} ต.ค.</a>`).join('');

document.getElementById('days').innerHTML = DAYS.map((d, di) => {
  const items = d.items.map((it, ii) => {
    const id = `${d.n}-${ii}`;
    const btns = [];
    if (it.map) btns.push(`<a class="btn btn-map" href="${esc(it.map)}" target="_blank" rel="noopener noreferrer">${ICON.pin}เปิดแผนที่</a>`);
    if (it.hotel) btns.push(`<a class="btn btn-hotel" href="${esc(it.hotel)}" target="_blank" rel="noopener noreferrer">${ICON.bed}ดูที่พัก</a>`);
    if (it.tt) btns.push(`<button type="button" class="btn btn-tt" data-title="${esc(it.title)}" data-user="${esc(it.tt.user)}" data-id="${esc(it.tt.id)}">${ICON.play}Preview<span class="who">@${esc(it.tt.user)}</span></button>`);
    return `<li class="item${done.has(id) ? ' done' : ''}" style="--c:var(--d${di+1})">
      <label class="chk"><input type="checkbox" data-id="${id}" aria-label="ทำแล้ว: ${esc(it.title)}"${done.has(id) ? ' checked' : ''}><span class="box">${ICON.check}</span></label>
      <div>
        <div class="time">${it.t} น.</div>
        <h3 class="title">${esc(it.title)}</h3>
        ${it.note ? `<p class="note">${esc(it.note)}</p>` : ''}
        ${btns.length ? `<div class="btns">${btns.join('')}</div>` : ''}
      </div></li>`;
  }).join('');
  return `<section class="day" id="day-${d.n}" style="--c:var(--d${di+1})">
    <div class="day-head">
      <div class="day-num">${d.n}</div>
      <div class="day-meta"><b>${d.wd}</b>ตุลาคม 2569</div>
      <div class="day-tag">${esc(d.tag)}</div>
    </div>
    <ol class="tl">${items}</ol></section>`;
}).join('');

/* checklist */
document.getElementById('days').addEventListener('change', e => {
  const cb = e.target.closest('input[type=checkbox]'); if (!cb) return;
  cb.checked ? done.add(cb.dataset.id) : done.delete(cb.dataset.id);
  cb.closest('.item').classList.toggle('done', cb.checked);
  save();
});

/* TikTok preview */
const dlg = document.getElementById('dlg'), frame = document.getElementById('frame');
document.getElementById('days').addEventListener('click', e => {
  const b = e.target.closest('.btn-tt'); if (!b) return;
  document.getElementById('dlg-title').textContent = b.dataset.title;
  document.getElementById('dlg-who').textContent = '@' + b.dataset.user;
  document.getElementById('dlg-open').href = ttUrl({user:b.dataset.user, id:b.dataset.id});
  frame.innerHTML = `<iframe src="https://www.tiktok.com/embed/v2/${encodeURIComponent(b.dataset.id)}" title="TikTok ${esc(b.dataset.title)}" allow="fullscreen; encrypted-media" loading="lazy"></iframe>`;
  dlg.showModal();
});
const closeDlg = () => { dlg.close(); };
dlg.addEventListener('close', () => { frame.innerHTML = ''; });
document.getElementById('dlg-x').addEventListener('click', closeDlg);
dlg.addEventListener('click', e => { if (e.target === dlg) closeDlg(); });

/* active day in nav */
const links = [...document.querySelectorAll('.nav a')];
const navEl = document.getElementById('nav');
let current = null;
const io = new IntersectionObserver(es => {
  es.forEach(en => {
    if (!en.isIntersecting || en.target.id === current) return;
    current = en.target.id;
    links.forEach(a => {
      const on = a.dataset.day === current;
      on ? a.setAttribute('aria-current', 'true') : a.removeAttribute('aria-current');
      if (on) navEl.scrollTo({ left: a.offsetLeft - (navEl.clientWidth - a.offsetWidth) / 2, behavior: 'auto' });
    });
  });
}, { rootMargin:'-30% 0px -60% 0px' });
document.querySelectorAll('.day').forEach(s => io.observe(s));
</script>
</body>
</html>
